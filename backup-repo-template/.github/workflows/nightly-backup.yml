name: Nightly backup

on:
  schedule:
    # 09:23 UTC, in the small hours in California. Off the hour on purpose: GitHub delays jobs queued on the hour.
    - cron: '23 9 * * *'
  workflow_dispatch:

# One at a time, and never cancel one halfway through a commit.
concurrency:
  group: nightly-backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this backup repo
        uses: actions/checkout@v4

      - name: Check out the TaskMan code (public) for the export command
        uses: actions/checkout@v4
        with:
          repository: daveknight/task-man
          ref: main
          path: task-man

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the export command
        working-directory: task-man
        run: npm ci -w @app/cli --include-workspace-root=false

      - name: Export with the read-only database role
        working-directory: task-man
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: npm run backup:export -w @app/cli -- --out "$GITHUB_WORKSPACE/backup/tasks.json"

      - name: Commit the backup
        # The file always changes (it records when it was taken), so there is a commit every night. That
        # keeps this repo "active", because GitHub switches off scheduled workflows in repos with no
        # commits for 60 days.
        run: |
          git config user.name "taskman-backup"
          git config user.email "taskman-backup@users.noreply.github.com"
          git add backup/tasks.json
          git commit -m "Backup $(date -u +%Y-%m-%d)"
          git push
